<!DOCTYPE html>
<HTML>
<HEAD>
    <TITLE>Шифрование текста</TITLE>
</HEAD>
<BODY>
<FORM method = "POST">
    <DIV style = "margin-bottom: 20px">
        <LABEL>Введите сообщение</LABEL><br>
    </DIV>
    <TEXTAREA style = "width:95%; margin-bottom: 20px; max-width: 600px"
              name = "text"
              placeholder = "Введите текст для шифрования"
              required></TEXTAREA><br>
    <INPUT type = "submit"
           style = "margin-right: 10px"
           value = "Отправить">
    <a href = "/"
       style = "font-size: small">Вернуться на главную страницу</a><br>
</FORM>
</BODY>
</HTML>
